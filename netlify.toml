[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "22"
[functions]
  node_bundler = "esbuild"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=180, must-revalidate"
[[redirects]]
  from = "/api/market"
  to = "/.netlify/functions/market"
  status = 200
[[redirects]]
  from = "/api/catalog"
  to = "/.netlify/functions/catalog"
  status = 200
