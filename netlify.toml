# Netlify publica index.html tal cual (no hay paso de compilación)
# y hace de puente con la API de Albion Online Data para evitar el bloqueo CORS.
[build]
  publish = "."

[[redirects]]
  from = "/proxy/america/*"
  to = "https://west.albion-online-data.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/proxy/europa/*"
  to = "https://europe.albion-online-data.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/proxy/asia/*"
  to = "https://east.albion-online-data.com/:splat"
  status = 200
  force = true

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
